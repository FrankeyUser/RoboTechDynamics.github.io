<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | RoboTech Dynamics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-robot"></i> RoboTech Dynamics</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="educacion.html">Aprende</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4 text-center">Nuestro Catálogo</h2>
        <div class="row g-4" id="catalog-container">
            <!-- Los productos se cargarán dinámicamente con JS para mantener el HTML limpio -->
        </div>
    </div>

    <script>
        const productos = [
            { id: 1, nombre: "Arduino Uno R3", precio: 25.00, desc: "Microcontrolador ATmega328P, ideal para inicio.", img: "images/arduino_uno_r3.jpeg" },
            { id: 2, nombre: "Raspberry Pi 4 - 4GB", precio: 65.00, desc: "Microordenador potente para visión artificial.", img: "images/raspiberry_pi_4_4gb.jpeg" },
            { id: 3, nombre: "Sensor Ultrasonico HC-SR04", precio: 3.50, desc: "Sensor de distancia por ultrasonido (2cm-400cm).", img: "images/HC-SR04.jpeg" },
            { id: 4, nombre: "Servomotor MG996R", precio: 12.00, desc: "Alto torque, engranajes metálicos, 180 grados.", img: "images/MG996R.jpeg" },
            { id: 5, nombre: "Módulo WiFi ESP32", precio: 8.50, desc: "Dual core con WiFi y Bluetooth integrados.", img: "images/wifi_module_esp32.jpeg" },
            { id: 6, nombre: "Sensor de Humedad Suelo", precio: 2.20, desc: "Mide la humedad para sistemas de riego auto.", img: "images/sensor_humedad_suelo.jpeg" },
            { id: 7, nombre: "Pantalla OLED 0.96\"", precio: 6.00, desc: "Pantalla I2C 128x64 para visualización de datos.", img: "images/OLED_Screen.jpeg" },
            { id: 8, nombre: "Driver L298N", precio: 4.50, desc: "Puente H doble para control de motores DC.", img: "images/l298n.jpeg" },
            { id: 9, nombre: "Kit Chasis Carro Robot", precio: 18.00, desc: "Base acrílica con 2 motores y rueda loca.", img: "images/car_robot_kit.jpeg" },
            { id: 10, nombre: "Sensor PIR HC-SR501", precio: 3.00, desc: "Detector de movimiento infrarrojo pasivo.", img: "images/Sensor_PIR_HC-SR501.jpeg" },
            { id: 11, nombre: "Batería Li-Po 7.4V 2200mAh", precio: 22.00, desc: "Alta densidad de energía para drones y robots.", img: "images/Batería Li-Po_7.4V_2200mAh.jpeg" },
            { id: 12, nombre: "Sensor Temperatura DHT22", precio: 5.50, desc: "Alta precisión en temperatura y humedad.", img: "images/dht22.jpeg" },
            { id: 13, nombre: "Modulo Bluetooth HC-05", precio: 7.00, desc: "Comunicación serial inalámbrica para Arduino.", img: "images/hc-05.jpeg" },
            { id: 14, nombre: "Motor Paso a Paso NEMA 17", precio: 15.00, desc: "Ideal para impresoras 3D y CNC.", img: "images/Motor_NEMA_17.jpeg" },
            { id: 15, nombre: "Módulo Relé 4 Canales", precio: 6.50, desc: "Control de cargas de CA hasta 10A/250V.", img: "images/Módulo_Relé_4_Canales.jpeg" },
            { id: 16, nombre: "Joystick Analógico", precio: 2.50, desc: "Control de 2 ejes (X, Y) y botón central.", img: "images/Joystick_Analógico.jpeg" },
            { id: 17, nombre: "Módulo Lector RFID RC522", precio: 5.00, desc: "Incluye tarjeta y llavero de 13.56MHz.", img: "images/RFID_RC522.jpeg" },
            { id: 18, nombre: "Teclado Matricial 4x4", precio: 3.20, desc: "Membrana delgada para entrada de datos.", img: "images/Teclado_Matricial_4x4.jpeg" },
            { id: 19, nombre: "Encoder Rotativo EC11", precio: 2.80, desc: "Medición de rotación y pulsador integrado.", img: "images/EC11.jpeg" },
            { id: 20, nombre: "Módulo GPS NEO-6M", precio: 16.00, desc: "Receptor de posicionamiento global satelital.", img: "images/NEO-6M.jpeg" }
        ];

        const container = document.getElementById('catalog-container');
        productos.forEach(p => {
            container.innerHTML += `
                <div class="col-md-3 col-sm-6">
                    <div class="card h-100 card-product shadow-sm border-0">
                        <img src="${p.img}" class="card-img-top p-3" alt="${p.nombre}" style="height:150px; object-fit:contain;">
                        <div class="card-body d-flex flex-column">
                            <h6 class="card-title fw-bold">${p.nombre}</h6>
                            <p class="card-text text-muted small flex-grow-1">${p.desc}</p>
                            <h5 class="text-primary mt-2">$${p.precio.toFixed(2)}</h5>
                            <button class="btn btn-sm btn-primary mt-3">Ver Detalle</button>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>

    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2023 RoboTech Dynamics. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
